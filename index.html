<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="estilos1.css">
</head>
<body>
  <h1>Buscador de Digimon</h1>
  <h3>Hecho por Deysly Beatriz Duran Alipaz con Ci: 13502101</h3>

  <div class="buscador">
    <select id="tipo">
      <option value="todos">Todos</option>
      <option value="nombre">Por nombre</option>
      <option value="nivel">Por nivel</option>
    </select>

    <input type="text" id="valor" placeholder="Ingrese nombre o nivel">
    <button onclick="buscar()">Buscar</button>
  </div>

  <table id="tabla">
    <thead>
      <tr>
        <th>Nombre</th>
        <th>Nivel</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    async function buscar() {
      const tipo = document.getElementById("tipo").value;
      const valor = document.getElementById("valor").value.trim().toLowerCase();
      const tabla = document.querySelector("#tabla tbody");

      let url = "";

      if (tipo === "todos") {
        url = "https://digimon-api.vercel.app/api/digimon";
      } else if (tipo === "nombre" && valor) {
        url = `https://digimon-api.vercel.app/api/digimon/name/${valor}`;
      } else if (tipo === "nivel" && valor) {
        url = `https://digimon-api.vercel.app/api/digimon/level/${valor}`;
      } else {
        alert("Ingresar Valor");
        return;
      }

      try {
        const res = await fetch(url);
        const data = await res.json();

        tabla.innerHTML = "";

        if (!Array.isArray(data)) {
          tabla.innerHTML = "<tr><td colspan='2'>No se encontraron resultados</td></tr>";
          return;
        }

        data.forEach(d => {
          const fila = `<tr><td>${d.name}</td><td>${d.level}</td></tr>`;
          tabla.innerHTML += fila;
        });
      } catch (err) {
        console.error(err);
        tabla.innerHTML = "<tr><td colspan='2'>Error al cargar los datos</td></tr>";
      }
    }
    buscar();
  </script>
</body>
</html>
